<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vikifitmeals</title>
<meta name="theme-color" content="#012d95">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="vikifitmeals">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#fbf1e6; --panel:#fbe8d8; --panel-line:#f4d9c2;
  --navy:#1b2f7a; --orange:#ee7d35; --text:#3b3a46; --muted:#8a7f78;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 40px}
a{color:inherit}
button{font:inherit}

/* ---------- главная ---------- */
.hero{position:relative;margin:0 -16px;overflow:hidden;background:#012d95;border-radius:0 0 30px 30px}
.hero img{display:block;height:auto;width:min(100%,380px);margin:0 auto}
.brand{margin-top:22px;text-align:center;padding:0 8px 8px}
.brand h1{font-family:var(--serif);font-size:44px;line-height:1.05;color:var(--navy);margin:0;letter-spacing:-.5px}
.brand p{margin:8px 0 0;color:var(--muted);font-size:16px}
.rule{width:64px;height:4px;border-radius:2px;background:var(--orange);margin:14px auto 0}

.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:22px 0 18px}
.fchip{border:1.5px solid var(--panel-line);background:#fff7ef;color:var(--navy);border-radius:999px;padding:7px 16px;font-weight:600;font-size:15px;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.grid{grid-template-columns:1fr 1fr 1fr}}
.rcard{display:block;text-decoration:none;background:#fff7ef;border:1px solid var(--panel-line);border-radius:22px;overflow:hidden;
  box-shadow:0 6px 18px rgba(120,70,30,.07);transition:transform .15s}
.rcard:active{transform:scale(.985)}
.rcard .ph{aspect-ratio:5/3;background:var(--panel);overflow:hidden}
.rcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.rcard .body{padding:14px 16px 16px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--orange);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:12px}
.rcard h3{font-family:var(--serif);color:var(--navy);font-size:21px;line-height:1.2;margin:6px 0 10px}
.mini{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:600}
.mini span{background:var(--panel);border-radius:999px;padding:3px 10px;color:var(--navy)}
.empty{text-align:center;color:var(--muted);padding:30px 0}

/* ---------- страница рецепта ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 0 6px}
.back,.share{border:0;background:#fff7ef;border:1px solid var(--panel-line);color:var(--navy);font-weight:600;font-size:15px;border-radius:999px;padding:8px 14px;cursor:pointer;text-decoration:none}
.head{display:grid;grid-template-columns:1fr;gap:14px;margin-top:6px}
.head .eyebrow::before{content:"✦"}
.head .eyebrow::after{content:"";width:28px;height:2px;background:var(--orange);display:inline-block}
.head h2{font-family:var(--serif);font-size:30px;line-height:1.12;color:var(--navy);margin:8px 0 12px;font-weight:800}
.head .rule2{width:56px;height:4px;border-radius:2px;background:var(--orange);margin-bottom:16px}
.macros{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;background:var(--navy);color:#fff;border-radius:18px;padding:12px 18px;box-shadow:0 8px 18px rgba(27,47,122,.25)}
.macros b{font-size:22px;margin-right:3px}
.macros small{font-size:13px;opacity:.9}
.macros i{color:var(--orange);font-style:normal}
@media(max-width:430px){.macros{padding:10px 14px;gap:4px 6px}.macros b{font-size:19px}.macros small{font-size:12px}}
.time{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#fff;border-radius:16px;padding:8px 16px;font-weight:700;font-size:18px;margin-top:12px;box-shadow:0 8px 18px rgba(238,125,53,.28)}
.time small{font-size:13px;font-weight:600}
.pills{display:flex;flex-direction:column;align-items:flex-start}
.photo{border-radius:24px;overflow:hidden;background:var(--panel)}
.photo img{display:block;width:100%;height:auto}

.sections{display:grid;grid-template-columns:1fr;gap:16px;margin-top:22px}
.panel{background:var(--panel);border:1px solid var(--panel-line);border-radius:22px;padding:18px 18px 20px}
.panel h4{display:flex;align-items:center;gap:12px;margin:0 0 14px;font-size:21px;color:var(--navy);font-weight:800}
.ico{flex:none;width:40px;height:40px;border-radius:12px;background:var(--orange);display:grid;place-items:center}
.ico svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ingr{list-style:none;margin:0;padding:0}
.ingr li{position:relative;padding:7px 0 7px 22px;font-size:16px}
.ingr li::before{content:"";position:absolute;left:2px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--orange)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 40px;font-size:16px}
.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.panel p{margin:0;font-size:16px}

.footer{margin-top:22px;display:grid;grid-template-columns:1fr;gap:12px}
.flink{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:700;color:var(--navy);font-size:17px;padding:6px 2px}
.flink .ico{width:38px;height:38px;border-radius:50%}
@media(min-width:860px){
  .head{grid-template-columns:1.05fr 1fr;align-items:center;gap:28px}
  .head h2{font-size:42px}
  .sections{grid-template-columns:1fr 1.15fr 1fr;align-items:start}
  .col3{display:grid;gap:16px}
  .footer{grid-template-columns:repeat(3,1fr)}
}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:999px;padding:10px 18px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.bottomfoot{text-align:center;color:var(--muted);font-size:13px;margin-top:26px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status"></div>
<script src="recipes.js"></script>
<script>
const ICONS = {
  basket:'<path d="M5 9h14l-1.2 9.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 9z"/><path d="M9 9l3-5 3 5"/>',
  whisk:'<path d="M12 3c-3 0-5 3-5 7 0 3 2 5 5 5s5-2 5-5c0-4-2-7-5-7z"/><path d="M12 3v12M9.5 4.5c-1 2-1 6 .5 10M14.5 4.5c1 2 1 6-.5 10M12 15v6"/>',
  bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
  heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  site:'<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.5 3.5 5.5 3.5 8.5s-1 6-3.5 8.5c-2.5-2.5-3.5-5.5-3.5-8.5s1-6 3.5-8.5z"/>',
  instagram:'<rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="16.8" cy="7.2" r=".6"/>',
  telegram:'<path d="M20.5 4.5L3.5 11l5 1.8L10 18.5l2.6-3.2 4.4 3.2 3.5-14z"/><path d="M8.5 12.8l8-5.8"/>'
};
const ico = n => '<span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[n]+'</svg></span>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app = document.getElementById('app');
let filter = 'Все';

function footer(){
  return '<div class="footer">' + SITE.links.map(l =>
    '<a class="flink" href="'+esc(l.url)+'" target="_blank" rel="noopener">'+ico(l.type)+'<span>'+esc(l.label)+'</span></a>').join('') + '</div>';
}

function home(){
  const cats = ['Все'].concat([...new Set(RECIPES.map(r => r.category))]);
  const list = RECIPES.filter(r => filter === 'Все' || r.category === filter);
  let h = '<div class="hero"><img src="cover.jpg" alt=""></div>';
  h += '<div class="brand"><h1>'+esc(SITE.name)+'</h1><p>'+esc(SITE.tagline)+'</p><div class="rule"></div></div>';
  if (cats.length > 2) {
    h += '<div class="chips">' + cats.map(c => '<button class="fchip" data-cat="'+esc(c)+'" aria-pressed="'+(c===filter)+'">'+esc(c)+'</button>').join('') + '</div>';
  } else h += '<div style="height:22px"></div>';
  if (!list.length) h += '<div class="empty">Здесь пока пусто</div>';
  h += '<div class="grid">' + list.map(r =>
    '<a class="rcard" href="#/r/'+esc(r.id)+'"><div class="ph"><img loading="lazy" src="'+esc(r.photo)+'" alt=""></div><div class="body">' +
    '<span class="eyebrow">'+esc(r.category)+'</span><h3>'+esc(r.title)+'</h3>' +
    '<div class="mini"><span>'+r.kcal+' ккал</span><span>'+r.time+' мин</span></div></div></a>').join('') + '</div>';
  h += footer();
  app.innerHTML = h;
  window.scrollTo(0,0);
}

function recipe(r){
  let h = '<div class="topbar"><a class="back" href="#/">← Все рецепты</a><button class="share" id="share">Поделиться</button></div>';
  h += '<div class="head"><div class="pills"><span class="eyebrow">'+esc(r.category)+'</span><h2>'+esc(r.title)+'</h2><div class="rule2"></div>' +
    '<div class="macros"><span><b>'+r.kcal+'</b><small>ккал</small></span><i>•</i><span><b>'+r.protein+'</b><small>белки</small></span><i>•</i>' +
    '<span><b>'+r.fat+'</b><small>жиры</small></span><i>•</i><span><b>'+r.carbs+'</b><small>углеводы</small></span></div>' +
    '<div class="time"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">'+ICONS.clock+'</svg><span>'+r.time+' <small>мин</small></span></div></div>' +
    '<div class="photo"><img src="'+esc(r.photo)+'" alt="'+esc(r.title)+'"></div></div>';
  h += '<div class="sections">';
  h += '<section class="panel"><h4>'+ico('basket')+'Ингредиенты</h4><ul class="ingr">'+r.ingredients.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul></section>';
  h += '<section class="panel"><h4>'+ico('whisk')+'Рецепт</h4><ol class="steps">'+r.steps.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ol></section>';
  h += '<div class="col3">';
  if (r.note) h += '<section class="panel"><h4>'+ico('bulb')+'Заметка</h4><p>'+esc(r.note)+'</p></section>';
  if (r.benefit) h += '<section class="panel"><h4>'+ico('heart')+'Польза для тебя</h4><p>'+esc(r.benefit)+'</p></section>';
  h += '</div></div>';
  h += footer();
  app.innerHTML = h;
  window.scrollTo(0,0);
  document.getElementById('share').onclick = async () => {
    const url = location.href;
    try {
      if (navigator.share) { await navigator.share({ title: r.title, text: r.title + ' · ' + SITE.name, url }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url); toast('Ссылка скопирована'); } catch (e) { toast(url); }
  };
}

function toast(t){
  const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 1800);
}

function route(){
  const m = location.hash.match(/^#\/r\/(.+)$/);
  const r = m && RECIPES.find(x => x.id === decodeURIComponent(m[1]));
  if (r) { recipe(r); document.title = r.title + ' · ' + SITE.name; }
  else { home(); document.title = SITE.name; }
}
app.addEventListener('click', e => {
  const c = e.target.closest('[data-cat]');
  if (c) { filter = c.dataset.cat; home(); }
});
window.addEventListener('hashchange', route);
route();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
